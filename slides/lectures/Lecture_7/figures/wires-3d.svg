<text x="1080.0" y="150.0" font-size="36" fill="#1d2733" text-anchor="start" font-weight="700">Each layer measures</text>
<text x="1080.0" y="188.0" font-size="36" fill="#1d2733" text-anchor="start" font-weight="700">only the distance</text>
<text x="1080.0" y="226.0" font-size="36" fill="#1d2733" text-anchor="start" font-weight="700">perpendicular to its wires.</text>
<line x1="1050" y1="262" x2="1340" y2="262" stroke="#dfe3e7" stroke-width="2"/>
<text x="1080.0" y="305.0" font-size="33" fill="#71787f" text-anchor="start" font-weight="400">x gives one coordinate,</text>
<text x="1080.0" y="342.0" font-size="33" fill="#71787f" text-anchor="start" font-weight="400">u and v (tilted by a small</text>
<text x="1080.0" y="379.0" font-size="33" fill="#71787f" text-anchor="start" font-weight="400">stereo angle α) give the other.</text>
<line x1="1050" y1="415" x2="1340" y2="415" stroke="#dfe3e7" stroke-width="2"/>
<text x="1080.0" y="458.0" font-size="33" fill="#71787f" text-anchor="start" font-weight="400">Resolution along the wires:</text>
<text x="1080.0" y="495.0" font-size="33" fill="#1d2733" text-anchor="start" font-weight="600">σ ≈ σ_wire / sin α,</text>
<text x="1080.0" y="532.0" font-size="33" fill="#71787f" text-anchor="start" font-weight="400">about 10× worse for α = 5°.</text>
