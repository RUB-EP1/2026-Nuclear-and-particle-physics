<text x="120.0" y="732.0" font-size="28" fill="#1d2733" text-anchor="start" font-weight="600">1 photon → 1 photoelectron → δⁿ electrons at the anode</text>
<text x="120.0" y="772.0" font-size="26" fill="#71787f" text-anchor="start" font-weight="400">drawn here: each dynode doubles (δ = 2); real dynodes: δ ≈ 3–5</text>
<text x="120.0" y="806.0" font-size="26" fill="#71787f" text-anchor="start" font-weight="400">so n ≈ 8–12 dynodes at about 100 V per step give 10⁶–10⁷</text>
<circle cx="132" cy="842" r="7" fill="#c9761a"/><text x="150.0" y="850.0" font-size="24" fill="#71787f" text-anchor="start" font-weight="400">= electrons (a number where dots would crowd)</text>
