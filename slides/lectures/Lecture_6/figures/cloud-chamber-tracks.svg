<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" font-size="27" fill="#243746"><text x="40" y="100" font-size="32" fill="#b8384a">α particle</text><text x="40" y="140" font-size="23" fill="#243746">Short, dense, fairly straight</text><text x="40" y="290" font-size="32" fill="#087bb9">Electron</text><text x="40" y="330" font-size="23" fill="#243746">Thin, often irregular</text><text x="40" y="490" font-size="32" fill="#2a9d74">Muon</text><text x="40" y="530" font-size="23" fill="#243746">Long, often nearly straight</text><path d="M510 115 L760 100" stroke="#b8384a" stroke-width="13" stroke-linecap="round"/><path d="M510 300 Q550 260 580 300 T640 305 Q660 260 700 290 T765 280 Q800 275 820 235" stroke="#087bb9" stroke-width="4" fill="none"/><path d="M510 540 L940 475" stroke="#2a9d74" stroke-width="4"/><text x="40" y="605" font-size="21" fill="#243746">Schematic patterns; real droplets are white. No common range scale.</text></g></svg>