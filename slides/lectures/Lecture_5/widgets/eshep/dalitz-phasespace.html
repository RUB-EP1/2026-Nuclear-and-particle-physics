<!doctype html><html lang="en"><meta charset="utf-8"><title>The Dalitz plot is flat</title>
<link rel="stylesheet" href="widget.css">
<canvas id="plot" aria-label="Phase-space events in the Λb → p K⁻ J/ψ Dalitz plot and their projections"></canvas>
<div id="controls"></div>
<div id="caption"></div>
<script src="common.js"></script>
<script>
// Two views: view=fill (events fill the plot; projections) and view=slice (one mass, one helicity angle).
const { LB, COLORS: C } = W, q = W.params(), view = q.get('view') || 'fill';
const st = { n: +(q.get('n') || 4000), mass: q.get('mass') !== 'm2', m12: +(q.get('m') || 1.9), cos: +(q.get('cos') || 0.4) };
const ctl = document.getElementById('controls'), cap = document.getElementById('caption');
const all = W.phaseSpaceEvents(20000, 3);
const xr = [1.8, 6.4], yr = [15.5, 26.7];
const [slo, shi] = W.s12Range();
if (view === 'fill') {
  W.slider(ctl, 'events', 100, 20000, 100, st.n, (v) => { st.n = v; draw(); });
  W.toggle(ctl, ' project onto m(pK) instead of m²(pK)', st.mass, (v) => { st.mass = v; draw(); });
  cap.textContent = 'Uniform phase-space events: no dynamics, no detector. Red: the exact phase-space projection.';
} else {
  W.slider(ctl, 'm(pK) [GeV]', (Math.sqrt(slo) + 0.01).toFixed(2), (Math.sqrt(shi) - 0.01).toFixed(2), 0.01, st.m12, (v) => { st.m12 = v; draw(); }, (v) => v.toFixed(2));
  W.slider(ctl, 'cos θ', -1, 1, 0.01, st.cos, (v) => { st.cos = v; draw(); }, (v) => v.toFixed(2));
  cap.textContent = 'θ: proton direction in the pK rest frame, measured from the direction opposite J/ψ.';
}

function hist(values, lo, hi, nb) { const h = new Array(nb).fill(0); values.forEach((v) => { const i = Math.floor((v - lo) / (hi - lo) * nb); if (i >= 0 && i < nb) h[i]++; }); return h; }
function drawFill(ctx, w, h) {
  const ev = all.slice(0, st.n);
  const box = { x: 90, y: 60, w: Math.min(w * 0.42, (h - 150) * 0.85), h: h - 150 };
  const { X, Y } = W.frame(ctx, box, xr, yr, { xticks: W.ticks(2, 6, 1), yticks: W.ticks(16, 26, 2), xlabel: 'm²(pK) [GeV²]', ylabel: 'm²(J/ψ p) [GeV²]' });
  ctx.save(); W.boundaryPath(ctx, X, Y); ctx.strokeStyle = C.blue; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
  const r = st.n > 5000 ? 1.4 : st.n > 1500 ? 2 : 3;
  ctx.fillStyle = 'rgba(21,43,65,0.75)'; ev.forEach(([a, b]) => { ctx.fillRect(X(a) - r / 2, Y(b) - r / 2, r, r); });
  // Projection
  const nb = 40, pbox = { x: box.x + box.w + 120, y: 60, w: w - box.x - box.w - 160, h: h - 150 };
  let lo, hi, vals, shape, xl;
  if (st.mass) { lo = Math.sqrt(slo); hi = Math.sqrt(shi); vals = ev.map((e) => Math.sqrt(e[0])); xl = 'm(pK) [GeV]'; shape = (m) => { const [a, b] = W.s13Range(m * m); return 2 * m * (b - a); }; }
  else { lo = slo; hi = shi; vals = ev.map((e) => e[0]); xl = 'm²(pK) [GeV²]'; shape = (s) => { const [a, b] = W.s13Range(s); return b - a; }; }
  const hh = hist(vals, lo, hi, nb), dx = (hi - lo) / nb;
  let norm = 0; for (let i = 0; i < 400; i++) { const t = lo + (i + 0.5) * (hi - lo) / 400; norm += shape(t) * (hi - lo) / 400; }
  const curvePts = []; for (let i = 0; i <= 200; i++) { const t = lo + (hi - lo) * i / 200 + 1e-9; curvePts.push([t, Math.max(shape(Math.min(t, hi - 1e-9)), 0) / norm * ev.length * dx]); }
  const ymax = 1.25 * Math.max(...hh, ...curvePts.map((p) => p[1]));
  const step = st.mass ? 0.5 : 1;
  const { X: PX, Y: PY } = W.frame(ctx, pbox, [lo, hi], [0, ymax], { xticks: W.ticks(lo, hi, step), yticks: [], xlabel: xl, ylabel: 'events per bin' });
  ctx.fillStyle = 'rgba(8,123,185,0.25)'; ctx.strokeStyle = C.blue;
  hh.forEach((c, i) => { const x0 = PX(lo + i * dx), x1 = PX(lo + (i + 1) * dx); ctx.fillRect(x0, PY(c), x1 - x0 - 1, PY(0) - PY(c)); });
  W.curve(ctx, curvePts, PX, PY, C.red, 3);
  W.text(ctx, 'phase space', pbox.x + pbox.w - 10, pbox.y + 20, { color: C.red, align: 'right' });
  W.text(ctx, `${ev.length} events`, box.x + box.w - 10, box.y + 20, { align: 'right', color: C.muted });
}
function drawSlice(ctx, w, h) {
  const s12 = st.m12 ** 2, [a, b] = W.s13Range(s12), s13 = a + (b - a) * (1 + st.cos) / 2;
  const box = { x: 90, y: 60, w: Math.min(w * 0.42, (h - 150) * 0.85), h: h - 150 };
  const { X, Y } = W.frame(ctx, box, xr, yr, { xticks: W.ticks(2, 6, 1), yticks: W.ticks(16, 26, 2), xlabel: 'm²(pK) [GeV²]', ylabel: 'm²(J/ψ p) [GeV²]' });
  ctx.save(); W.boundaryPath(ctx, X, Y); ctx.fillStyle = C.fill; ctx.fill(); ctx.strokeStyle = C.blue; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
  W.curve(ctx, [[s12, a], [s12, b]], X, Y, C.green, 4);
  [[a, 'cos θ = −1'], [b, 'cos θ = +1']].forEach(([v, t]) => { ctx.fillStyle = C.green; ctx.beginPath(); ctx.arc(X(s12), Y(v), 6, 0, 7); ctx.fill(); W.text(ctx, t, X(s12) + (v === a ? -12 : 12), Y(v) + (v === a ? 30 : -12), { size: 18, color: C.green, align: v === a ? 'right' : 'left' }); });
  ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(X(s12), Y(s13), 10, 0, 7); ctx.fill();
  // Right: the pK rest frame picture.
  const cx = box.x + box.w + (w - box.x - box.w) / 2, cy = h * 0.42, R = Math.min(w - box.x - box.w - 120, h * 0.6) / 2.4;
  W.text(ctx, 'pK rest frame', cx, 40, { align: 'center', weight: 600, size: 22 });
  const th = Math.acos(st.cos);
  const arrow = (dx, dy, col, lab) => { ctx.save(); ctx.strokeStyle = ctx.fillStyle = col; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + dx * 0.92, cy + dy * 0.92); ctx.stroke(); const an = Math.atan2(dy, dx); ctx.beginPath(); ctx.moveTo(cx + dx, cy + dy); ctx.lineTo(cx + dx - 18 * Math.cos(an - 0.4), cy + dy - 18 * Math.sin(an - 0.4)); ctx.lineTo(cx + dx - 18 * Math.cos(an + 0.4), cy + dy - 18 * Math.sin(an + 0.4)); ctx.fill(); ctx.font = '600 24px Helvetica'; ctx.fillText(lab, cx + dx * 1.12 - 10, cy + dy * 1.12 + (Math.abs(dy) < 5 ? -16 : 8)); ctx.restore(); };
  // Axis: direction opposite J/ψ (the pK flight direction in the Λb frame) points right.
  ctx.save(); ctx.strokeStyle = C.muted; ctx.setLineDash([8, 6]); ctx.beginPath(); ctx.moveTo(cx - R * 1.3, cy); ctx.lineTo(cx + R * 1.3, cy); ctx.stroke(); ctx.restore();
  arrow(-R * 0.75, 0, C.green, 'J/ψ');
  arrow(R * Math.cos(th), -R * Math.sin(th), C.blue, 'p');
  arrow(-R * Math.cos(th), R * Math.sin(th), C.red, 'K⁻');
  ctx.save(); ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, R * 0.32, -th, 0); ctx.stroke(); ctx.restore();
  W.text(ctx, 'θ', cx + R * 0.38 * Math.cos(th / 2), cy - R * 0.38 * Math.sin(th / 2) + 8, { size: 24, weight: 600 });
  W.text(ctx, `m²(J/ψ p) = ${s13.toFixed(2)} GeV²`, cx, h - 92, { align: 'center', color: C.red, size: 22 });
  W.text(ctx, 'the J/ψ momentum in this frame defines the axis', cx, h - 62, { align: 'center', color: C.muted, size: 17 });
}
function draw() { const { ctx, w, h } = W.setupCanvas(document.getElementById('plot')); (view === 'fill' ? drawFill : drawSlice)(ctx, w, h); }
W.live(draw);
</script></html>
