<!doctype html><html lang="en"><meta charset="utf-8"><title>Shape and orientation</title>
<link rel="stylesheet" href="widget.css">
<canvas id="plot" aria-label="Momenta of one Λb → p K⁻ J/ψ event and its Dalitz-plot point"></canvas>
<div id="controls"></div>
<div id="caption">Physical masses. Rotating moves every arrow, but no pair mass: the Dalitz point stays put.</div>
<script src="common.js"></script>
<script>
const { LB, COLORS: C } = W, q = W.params();
const st = { m12: +(q.get('m') || 1.8), cos: +(q.get('cos') || 0.3), rot: +(q.get('rot') || 0) };
const ctl = document.getElementById('controls');
const [mlo, mhi] = W.s12Range().map(Math.sqrt);
W.slider(ctl, 'm(pK) [GeV]', (mlo + 0.01).toFixed(2), (mhi - 0.01).toFixed(2), 0.01, st.m12, (v) => { st.m12 = v; draw(); }, (v) => v.toFixed(2));
W.slider(ctl, 'cos θ', -0.99, 0.99, 0.01, st.cos, (v) => { st.cos = v; draw(); }, (v) => v.toFixed(2));
W.slider(ctl, 'rotate the event', 0, 360, 1, st.rot, (v) => { st.rot = v; draw(); }, (v) => v + '°');

function arrow(ctx, x0, y0, x1, y1, color, label) {
  const a = Math.atan2(y1 - y0, x1 - x0), L = Math.hypot(x1 - x0, y1 - y0);
  ctx.save(); ctx.strokeStyle = ctx.fillStyle = color; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - 14 * Math.cos(a), y1 - 14 * Math.sin(a)); ctx.stroke();
  if (L > 4) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - 20 * Math.cos(a - 0.38), y1 - 20 * Math.sin(a - 0.38)); ctx.lineTo(x1 - 20 * Math.cos(a + 0.38), y1 - 20 * Math.sin(a + 0.38)); ctx.fill(); }
  if (label) { ctx.font = '600 24px Helvetica, Arial'; ctx.fillText(label, x1 + 12 * Math.cos(a) - 12, y1 + 16 * Math.sin(a) + 8); }
  ctx.restore();
}
function draw() {
  const { ctx, w, h } = W.setupCanvas(document.getElementById('plot'));
  const s12 = st.m12 ** 2, s13 = W.s13Range_of_cos(s12, st.cos), v = W.fourVectors(s12, s13);
  const r = st.rot * Math.PI / 180, rot = (p) => [p[0] * Math.cos(r) - p[2] * Math.sin(r), p[0] * Math.sin(r) + p[2] * Math.cos(r)];
  const cols = [C.blue, C.red, C.green];
  // Left: the event, momenta from the decay point.
  const cx = w * 0.19, cy = h * 0.47, sc = Math.min(w * 0.17, h * 0.38) / 1.6;
  W.text(ctx, 'Λb rest frame', w * 0.19, 30, { size: 21, weight: 600, align: 'center' });
  ctx.save(); ctx.strokeStyle = C.grid; ctx.setLineDash([6, 6]); ctx.beginPath(); ctx.arc(cx, cy, 1.6 * sc, 0, 2 * Math.PI); ctx.stroke(); ctx.restore();
  v.forEach((p, i) => { const [a, b] = rot(p); arrow(ctx, cx, cy, cx + a * sc, cy - b * sc, cols[i], LB.names[i]); });
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, 2 * Math.PI); ctx.fill();
  // Middle: the same three momenta head to tail close into a triangle.
  const tx = w * 0.5, ty = h * 0.5, ts = sc * 0.95;
  W.text(ctx, 'Head to tail', w * 0.5, 30, { size: 21, weight: 600, align: 'center' });
  // Start so that the triangle's centroid sits at (tx, ty).
  const c0 = v.map(rot); let px = tx - ts * (2 * c0[0][0] + c0[1][0]) / 3, py = ty + ts * (2 * c0[0][1] + c0[1][1]) / 3;
  v.forEach((p, i) => { const [a, b] = rot(p); arrow(ctx, px, py, px + a * ts, py - b * ts, cols[i]); px += a * ts; py -= b * ts; });
  W.text(ctx, 'Σ p = 0', tx, h - 70, { size: 22, color: C.muted, align: 'center' });
  // Right: the Dalitz plot.
  const box = { x: w * 0.68, y: 70, w: w * 0.29, h: h - 160 };
  const xr = [1.8, 6.4], yr = [13.5, 26.7];
  const { X, Y } = W.frame(ctx, box, xr, yr, { xticks: W.ticks(2, 6, 1), yticks: W.ticks(16, 26, 2), xlabel: 'm²(pK) [GeV²]', ylabel: 'm²(J/ψ p) [GeV²]' });
  ctx.save(); W.boundaryPath(ctx, X, Y); ctx.fillStyle = C.fill; ctx.fill(); ctx.strokeStyle = C.blue; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
  ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(X(s12), Y(s13), 10, 0, 2 * Math.PI); ctx.fill();
  W.text(ctx, `m²(pK) = ${s12.toFixed(2)} GeV²`, box.x + 20, box.y + box.h - 44, { size: 20, color: C.red });
  W.text(ctx, `m²(J/ψ p) = ${s13.toFixed(2)} GeV²`, box.x + 20, box.y + box.h - 18, { size: 20, color: C.red });
  W.text(ctx, '2 numbers: shape   +   3 angles: orientation   =   5', w * 0.06, h - 22, { size: 22, weight: 600, color: C.blue });
}
W.live(draw);
</script></html>
